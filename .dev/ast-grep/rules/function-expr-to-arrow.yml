id: export-function-to-arrow
language: typescript
rule:
  pattern: |
    export function $NAME($$$PARAMS) {
      $$$BODY
    }
  not:
    inside:
      pattern: async function $NAME
fix: |
  export const $NAME = ($$$PARAMS) => {
    $$$BODY
  }
---
id: export-async-function-to-arrow
language: typescript
rule:
  pattern: |
    export async function $NAME($$$PARAMS) {
      $$$BODY
    }
fix: |
  export const $NAME = async ($$$PARAMS) => {
    $$$BODY
  }
---
id: function-to-arrow
language: typescript
rule:
  pattern: |
    function $NAME($$$PARAMS) {
      $$$BODY
    }
  not:
    any:
      - inside:
          pattern: async function $NAME
      - inside:
          pattern: export function $NAME
fix: |
  const $NAME = ($$$PARAMS) => {
    $$$BODY
  }
---
id: async-function-to-arrow
language: typescript
rule:
  pattern: |
    async function $NAME($$$PARAMS) {
      $$$BODY
    }
  not:
    inside:
      pattern: export async function $NAME
fix: |
  const $NAME = async ($$$PARAMS) => {
    $$$BODY
  }
